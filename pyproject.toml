[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-gateway-demo"
version = "0.0.3"
description = "A multiplayer, MCP-controlled action game built on top of mcp-gtw."
requires-python = ">=3.12"
dependencies = [
    "mcp-gtw>=0.0.7",
    "httpx>=0.28.1,<1",
    "pyjwt[crypto]>=2.15.1,<3",
    "fastapi>=0.143.0,<1",
    "pydantic>=2.14.0,<3",
    "pydantic-settings>=2.15.0,<3",
    "uvicorn[standard]>=0.54.0,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1,<1",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.17.0,<1",
]

[tool.uv.sources]
mcp-gtw = { path = "../mcp-gtw", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
exclude = ["src/app/web/dist/**"]

[tool.hatch.build.targets.wheel.force-include]
"src/app/web/dist" = "app/web/dist"

[tool.hatch.build.targets.sdist]
exclude = ["src/app/web/dist/**"]

[tool.hatch.build.targets.sdist.force-include]
"src/app/web/dist" = "src/app/web/dist"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    ": \\.\\.\\.$",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "mcpgtw"]
